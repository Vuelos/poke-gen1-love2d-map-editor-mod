name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "v0.0.1"

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          VERSION=${GITHUB_REF_NAME}
          zip -r "project-${VERSION}.zip" . \
            -x ".git/*" \
            -x ".github/*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: project-${{ github.ref_name }}.zip
